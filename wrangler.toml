#:schema node_modules/wrangler/config-schema.json
name = "dxd-cdn"
main = "src/index.js"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# Custom domain configuration
routes = [
    { pattern = "cdn.designxdevelop.com", custom_domain = true }
]

# R2 bucket configuration
[[r2_buckets]]
binding = "CDN_BUCKET"
bucket_name = "dxd-cdn"

# Workers Caching. Immutable objects (hashed snapshots, /gh/ versioned files) get
# a real edge copy and request collapsing. Live objects are governed by
# LIVE_EDGE_MAX_AGE below; writes purge their own key via ctx.cache.purge().
[cache]
enabled = true

# Environment variables
[vars]
ENVIRONMENT = "production"
PUBLIC_ORIGIN = "https://cdn.designxdevelop.com"
# Edge TTL for live objects, in seconds. A failed purge hides a publish for up
# to this long, so this stays at 0 until purge-on-write is confirmed against
# production. Confirmed 2026-10-05: Objects API PUT returns `purged: true` and a
# republish serves the new bytes on the next GET. Browsers always revalidate at
# any value; rollback is this value back to 0 plus a deploy, with no code change.
LIVE_EDGE_MAX_AGE = 3600

# Admin panel (/admin) sign-in, through Cloudflare Access. See docs/admin-panel.md.
# None of these is a secret. With the first two empty the panel stays closed.
# They match the Access application "DXD CDN admin" (cdn.designxdevelop.com/admin).
# Team domain, e.g. "your-team.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = "designxdevelop.cloudflareaccess.com"
# The Access application's Audience (AUD) tag
ACCESS_AUD = "e53991ddb7dc3a115e5a43fea48b9edb4885051d022e2a4e609a349305e78616"
# Comma-separated emails allowed to delete from the panel. Everyone else who
# can sign in can browse and upload only.
ADMIN_OWNERS = "austin@designxdevelop.com"

# Secrets (set via: wrangler secret put UPLOAD_PASSWORD)
# UPLOAD_PASSWORD - Operator token for the HTTP APIs (Authorization: Bearer). Not used by /admin
# APP_TOKENS - Optional scoped per-app tokens for the Objects API

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false