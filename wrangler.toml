#:schema node_modules/wrangler/config-schema.json
name = "dxd-cdn"
main = "src/index.js"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# Custom domain configuration
routes = [
    { pattern = "cdn.designxdevelop.com", custom_domain = true }
]

# R2 bucket configuration
[[r2_buckets]]
binding = "CDN_BUCKET"
bucket_name = "dxd-cdn"

# Workers Caching. Immutable objects (hashed snapshots, /gh/ versioned files) get
# a real edge copy and request collapsing. Live objects are governed by
# LIVE_EDGE_MAX_AGE below; writes purge their own key via ctx.cache.purge().
[cache]
enabled = true

# Environment variables
[vars]
ENVIRONMENT = "production"
PUBLIC_ORIGIN = "https://cdn.designxdevelop.com"
# Edge TTL for live objects, in seconds. A failed purge hides a publish for up
# to this long, so this stays at 0 until purge-on-write is confirmed against
# production. Confirmed 2026-10-05: Objects API PUT returns `purged: true` and a
# republish serves the new bytes on the next GET. Browsers always revalidate at
# any value; rollback is this value back to 0 plus a deploy, with no code change.
LIVE_EDGE_MAX_AGE = 3600

# Secrets (set via: wrangler secret put UPLOAD_PASSWORD)
# UPLOAD_PASSWORD - Required for /upload and /browse routes
# APP_TOKENS - Optional scoped per-app tokens for the Objects API

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false